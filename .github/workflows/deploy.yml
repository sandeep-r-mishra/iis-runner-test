name: Deploy ASP.NET Framework App to IIS

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Restore NuGet packages
      - name: Restore NuGet packages
        run: |
          & "C:\Program Files\dotnet\dotnet.exe" restore "D:\IIS-Project-De-windows\QMSProject\clover.qms.web\clover.qms.web.sln"

      # Build Solution with MSBuild
      - name: Build Solution
        run: |
          & "C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe" "D:\IIS-Project-De-windows\QMSProject\clover.qms.web\clover.qms.web.sln" /p:Configuration=Release

      # Deploy using WebDeploy
      - name: Deploy to IIS
        run: |
          & "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe" -verb:sync `
            -source:contentPath="D:\IIS-Project-De-windows\QMSProject\clover.qms.web\bin\Release\_PublishedWebsites\clover.qms.web" `
            -dest:contentPath="C:\inetpub\wwwroot\QMS" `
            -disableLink:AppPoolExtension `
            -disableLink:CertificateExtension `
            -enableRule:DoNotDeleteRule `
            -enableRule:DoNotBackupRule

      # Restart IIS (optional)
      - name: Restart IIS
        run: iisreset
